<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作説明録画付き 並び替えクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 追加: 紙吹雪エフェクトライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* ドラッグ中の透明度 */
        .dragging {
            opacity: 0.5;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        /* スポットライトエフェクト */
        #spotlight-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 40;
            background: radial-gradient(circle 150px at var(--x) var(--y), transparent 0%, rgba(0, 0, 0, 0.6) 100%);
            display: none;
        }
        body.spotlight-active #spotlight-overlay {
            display: block;
        }

        /* クリック波紋エフェクト */
        .click-ripple {
            position: fixed;
            border-radius: 50%;
            border: 4px solid #ef4444; /* Tailwind red-500 */
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: ripple-animation 0.8s ease-out forwards;
            z-index: 50;
        }

        @keyframes ripple-animation {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 80px; height: 80px; opacity: 0; }
        }

        /* チュートリアルモード時のホバー強調 */
        body.tutorial-mode .interactive:hover {
            outline: 3px solid #eab308; /* Tailwind yellow-500 */
            outline-offset: 2px;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.6);
            transition: all 0.2s;
        }

        /* 擬似マウスカーソル（自動デモ用） */
        #demo-cursor {
            position: fixed;
            width: 36px;
            height: 36px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512"><path fill="%23ffffff" stroke="%23000000" stroke-width="20" d="M0 55.2V426c0 12.2 9.9 22 22 22c4.6 0 8.9-1.4 12.5-3.9l98.8-67.9 59.5 106.6c5.9 10.6 19.3 14.4 29.9 8.5l26-14.6c10.6-5.9 14.4-19.3 8.5-29.9L197.6 340l98.3-9.1c11.6-1.1 20.4-11 19.8-22.6c-.2-4.5-2.1-8.7-5.3-11.9L25.3 10.2C16.8 1.8 3.5 1.5-5.3 10C-9.3 14-11.2 19.2-11.2 24.6z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 9999;
            display: none;
            transition: top 0.6s ease-in-out, left 0.6s ease-in-out, transform 0.1s;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
        }
        
        /* 小学生向けポップなフォント設定 */
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Meiryo', sans-serif;
        }
    </style>
</head>
<body class="bg-yellow-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- 自動デモ用カーソル -->
    <div id="demo-cursor"></div>

    <!-- スポットライト用オーバーレイ -->
    <div id="spotlight-overlay" style="--x: 50%; --y: 50%;"></div>

    <header class="bg-blue-600 text-white p-4 shadow-md z-10 relative">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-list-ol mr-2"></i>ならびかえクイズ & ろくがツール</h1>
            <div class="flex gap-4">
                <button id="toggle-tutorial" class="interactive bg-blue-500 hover:bg-blue-400 px-3 py-1 rounded text-sm font-medium transition flex items-center gap-2">
                    <i class="fas fa-magic"></i> アテンションON
                </button>
                <button id="toggle-spotlight" class="interactive bg-blue-500 hover:bg-blue-400 px-3 py-1 rounded text-sm font-medium transition flex items-center gap-2">
                    <i class="fas fa-search"></i> スポットライト
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 z-10 relative">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg border-4 border-orange-300 relative">
            
            <h2 class="text-2xl font-bold mb-6 text-center text-orange-600 border-b-2 border-orange-200 pb-4">
                もんだい：いきものを<ruby>小<rt>ちい</rt></ruby>さいじゅんに<ruby>並<rt>なら</rt></ruby>べよう！
            </h2>

            <!-- 並び替えリスト -->
            <ul id="sortable-list" class="space-y-3 mb-8">
                <!-- JavaScriptで動的に生成されます -->
            </ul>

            <div class="text-center">
                <button id="check-btn" class="interactive bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-10 rounded-full shadow-lg transform transition hover:scale-110 active:scale-95 text-xl border-b-4 border-green-700">
                    <i class="fas fa-check-circle mr-2"></i>こたえあわせ！
                </button>
            </div>

            <!-- 結果表示エリア -->
            <div id="result-message" class="mt-6 text-center text-2xl font-bold hidden p-4 rounded-xl animate-bounce">
            </div>
        </div>
    </main>

    <!-- 録画コントロールパネル（フローティング） -->
    <div class="fixed bottom-6 right-6 bg-white p-5 rounded-xl shadow-2xl border border-gray-200 z-50 w-80">
        <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
            <i class="fas fa-video text-red-500"></i> <ruby>操作説明<rt>そうさせつめい</rt></ruby>のろくが
        </h3>
        <p class="text-xs text-gray-500 mb-4">じどうデモをつかって、わかりやすいせつめいどうがをつくろう。</p>
        
        <div class="flex flex-col gap-2">
            <button id="demo-record-btn" class="interactive bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded transition flex items-center justify-center gap-2">
                <i class="fas fa-robot"></i> じどうデモ＆ろくがかいし
            </button>
            <button id="start-record-btn" class="interactive bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded transition flex items-center justify-center gap-2 mt-2 border-t border-gray-100 pt-2">
                <i class="fas fa-hand-pointer"></i> 自分で操作してろくが
            </button>
            <button id="stop-record-btn" class="interactive bg-gray-500 text-white font-bold py-2 px-4 rounded opacity-50 cursor-not-allowed flex items-center justify-center gap-2" disabled>
                <i class="fas fa-square"></i> ろくがていし＆ほぞん
            </button>
        </div>
        <div id="recording-status" class="mt-3 text-sm text-red-500 font-bold hidden text-center animate-pulse">
            ろくがちゅう...
        </div>
    </div>

    <script>
        /* =========================================
           クイズのデータとロジック
        ========================================= */
        const quizData = [
            { id: 'A', text: '🐘 ぞう', correctIndex: 2 },
            { id: 'B', text: '🐜 あり', correctIndex: 0 },
            { id: 'C', text: '🐳 くじら', correctIndex: 3 },
            { id: 'D', text: '🐈 ねこ', correctIndex: 1 }
        ];

        let currentItems = [...quizData];
        const listContainer = document.getElementById('sortable-list');

        function renderList() {
            listContainer.innerHTML = '';
            currentItems.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'interactive draggable bg-white border-4 border-orange-200 rounded-2xl p-4 flex items-center justify-between cursor-move hover:bg-orange-50 transition shadow-sm';
                li.draggable = true;
                li.dataset.index = index;
                li.dataset.id = item.id;

                li.innerHTML = `
                    <div class="flex items-center gap-4 pointer-events-none">
                        <span class="bg-orange-400 text-white font-bold w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow">${item.id}</span>
                        <span class="text-2xl font-bold text-gray-700">${item.text}</span>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button id="up-btn-${item.id}" class="interactive up-btn p-2 bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200 hover:text-blue-800 transition ${index === 0 ? 'opacity-0 pointer-events-none' : ''}" onclick="moveItem(${index}, -1)">
                            <i class="fas fa-chevron-up"></i>
                        </button>
                        <button id="down-btn-${item.id}" class="interactive down-btn p-2 bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200 hover:text-blue-800 transition ${index === currentItems.length - 1 ? 'opacity-0 pointer-events-none' : ''}" onclick="moveItem(${index}, 1)">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(li);
            });
            setupDragAndDrop();
        }

        // ボタンでの移動
        window.moveItem = function(index, direction) {
            if (index + direction < 0 || index + direction >= currentItems.length) return;
            const temp = currentItems[index];
            currentItems[index] = currentItems[index + direction];
            currentItems[index + direction] = temp;
            renderList();
        };

        /* ドラッグ＆ドロップロジック */
        let draggedItemIndex = null;

        function setupDragAndDrop() {
            const draggables = document.querySelectorAll('.draggable');
            
            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', (e) => {
                    draggedItemIndex = parseInt(draggable.dataset.index);
                    setTimeout(() => draggable.classList.add('dragging'), 0);
                });

                draggable.addEventListener('dragend', () => {
                    draggable.classList.remove('dragging');
                    draggedItemIndex = null;
                });
            });

            listContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                const afterElement = getDragAfterElement(listContainer, e.clientY);
                const dragging = document.querySelector('.dragging');
                if (!dragging) return;

                if (afterElement == null) {
                    listContainer.appendChild(dragging);
                } else {
                    listContainer.insertBefore(dragging, afterElement);
                }
            });

            listContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                // DOMの並び順を取得して currentItems を更新
                const newOrderIds = Array.from(listContainer.children).map(li => li.dataset.id);
                currentItems = newOrderIds.map(id => quizData.find(item => item.id === id));
                renderList(); // 再描画してインデックスとボタンを更新
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.draggable:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // 正誤判定
        document.getElementById('check-btn').addEventListener('click', () => {
            const isCorrect = currentItems.every((item, index) => item.correctIndex === index);
            const resultDiv = document.getElementById('result-message');
            resultDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'animate-bounce');
            
            if (isCorrect) {
                resultDiv.classList.add('bg-green-100', 'text-green-800', 'animate-bounce');
                resultDiv.innerHTML = '<i class="fas fa-star text-yellow-500 mr-2"></i> だいせいかい！やったね！ <i class="fas fa-star text-yellow-500 ml-2"></i>';
                
                // 紙吹雪エフェクトの実行
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea']
                });
            } else {
                resultDiv.classList.add('bg-red-100', 'text-red-800');
                resultDiv.innerHTML = '<i class="fas fa-question-circle mr-2"></i> おしい！もういちどかんがえてみよう。';
            }
        });

        // 初期描画
        renderList();


        /* =========================================
           アテンション（チュートリアル）機能
        ========================================= */
        const body = document.body;
        const toggleTutorialBtn = document.getElementById('toggle-tutorial');
        const toggleSpotlightBtn = document.getElementById('toggle-spotlight');
        const spotlightOverlay = document.getElementById('spotlight-overlay');

        // クリックリップルエフェクト
        document.addEventListener('click', (e) => {
            if (!body.classList.contains('tutorial-mode')) return;
            
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 800);
        });

        // スポットライトマウス追従
        document.addEventListener('mousemove', (e) => {
            if (!body.classList.contains('spotlight-active')) return;
            spotlightOverlay.style.setProperty('--x', `${e.clientX}px`);
            spotlightOverlay.style.setProperty('--y', `${e.clientY}px`);
        });

        toggleTutorialBtn.addEventListener('click', () => {
            body.classList.toggle('tutorial-mode');
            if (body.classList.contains('tutorial-mode')) {
                toggleTutorialBtn.innerHTML = '<i class="fas fa-magic"></i> アテンションON';
                toggleTutorialBtn.classList.replace('bg-gray-500', 'bg-blue-500');
            } else {
                toggleTutorialBtn.innerHTML = '<i class="fas fa-magic"></i> アテンションOFF';
                toggleTutorialBtn.classList.replace('bg-blue-500', 'bg-gray-500');
            }
        });
        
        // 初期状態でアテンションモードをONにしておく
        body.classList.add('tutorial-mode');

        toggleSpotlightBtn.addEventListener('click', () => {
            body.classList.toggle('spotlight-active');
            if (body.classList.contains('spotlight-active')) {
                toggleSpotlightBtn.classList.replace('bg-blue-500', 'bg-indigo-600');
            } else {
                toggleSpotlightBtn.classList.replace('bg-indigo-600', 'bg-blue-500');
            }
        });


        /* =========================================
           画面録画（Screen Capture API）機能
        ========================================= */
        let mediaRecorder;
        let recordedChunks = [];
        let screenStream;

        const startRecordBtn = document.getElementById('start-record-btn');
        const stopRecordBtn = document.getElementById('stop-record-btn');
        const recordingStatus = document.getElementById('recording-status');

        startRecordBtn.addEventListener('click', async () => {
            try {
                // 画面共有の許可を要求
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false // 今回はマイク音声なし（必要ならtrueに変更）
                });

                mediaRecorder = new MediaRecorder(screenStream, { mimeType: 'video/webm' });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    // 動画ファイル(WebM)としてダウンロード
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'tutorial-recording.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    
                    recordedChunks = [];
                    resetRecordUI();
                };

                // ブラウザ側の画面共有停止ボタンが押された時の処理
                screenStream.getVideoTracks()[0].addEventListener('ended', () => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                });

                mediaRecorder.start();
                
                // UIの更新
                startRecordBtn.disabled = true;
                startRecordBtn.classList.add('opacity-50', 'cursor-not-allowed');
                stopRecordBtn.disabled = false;
                stopRecordBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                stopRecordBtn.classList.replace('bg-gray-500', 'bg-gray-800');
                recordingStatus.classList.remove('hidden');

            } catch (err) {
                console.error("録画の開始に失敗しました: ", err);
                alert("録画を開始できませんでした。画面共有の権限を確認してください。");
            }
        });

        stopRecordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                // ストリームも停止
                screenStream.getTracks().forEach(track => track.stop());
            }
        });

        function resetRecordUI() {
            startRecordBtn.disabled = false;
            startRecordBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('demo-record-btn').disabled = false;
            document.getElementById('demo-record-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            stopRecordBtn.disabled = true;
            stopRecordBtn.classList.add('opacity-50', 'cursor-not-allowed');
            stopRecordBtn.classList.replace('bg-gray-800', 'bg-gray-500');
            recordingStatus.classList.add('hidden');
        }

        /* =========================================
           自動デモ（シナリオ）機能
        ========================================= */
        const demoCursor = document.getElementById('demo-cursor');
        let isDemoRunning = false;

        // シナリオ定義：正解になるように矢印ボタンを押していく
        // 初期状態: A(ぞう), B(あり), C(くじら), D(ねこ)
        // 目標状態: B(あり), D(ねこ), A(ぞう), C(くじら)
        const demoScenario = [
            { type: 'wait', ms: 1000 },
            { type: 'move', targetId: 'down-btn-A' },
            { type: 'wait', ms: 500 },
            { type: 'click', targetId: 'down-btn-A' }, // ぞうをBの下へ
            { type: 'wait', ms: 800 },
            { type: 'move', targetId: 'down-btn-A' },
            { type: 'wait', ms: 500 },
            { type: 'click', targetId: 'down-btn-A' }, // ぞうをCの下へ
            { type: 'wait', ms: 800 },
            { type: 'move', targetId: 'down-btn-C' },
            { type: 'wait', ms: 500 },
            { type: 'click', targetId: 'down-btn-C' }, // くじらをDの下へ
            { type: 'wait', ms: 1500 },
            { type: 'move', targetId: 'check-btn' },
            { type: 'wait', ms: 500 },
            { type: 'click', targetId: 'check-btn' },  // こたえあわせ
            { type: 'wait', ms: 4000 }, // 結果と紙吹雪を見せる
        ];

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function runDemoScenario() {
            if (isDemoRunning) return;
            isDemoRunning = true;
            demoCursor.style.display = 'block';
            
            // アテンションモードとスポットライトを強制ON
            if (!body.classList.contains('tutorial-mode')) toggleTutorialBtn.click();
            if (!body.classList.contains('spotlight-active')) toggleSpotlightBtn.click();

            // 初期位置を画面中央下にセット
            demoCursor.style.left = `${window.innerWidth / 2}px`;
            demoCursor.style.top = `${window.innerHeight}px`;
            await sleep(500);

            for (const step of demoScenario) {
                if (!isDemoRunning) break; // 中断処理

                if (step.type === 'wait') {
                    await sleep(step.ms);
                } 
                else if (step.type === 'move') {
                    const el = document.getElementById(step.targetId);
                    if (el) {
                        const rect = el.getBoundingClientRect();
                        // 要素の中央へ移動
                        const targetX = rect.left + rect.width / 2;
                        const targetY = rect.top + rect.height / 2;
                        
                        // カーソルの左上基点を考慮して少しずらす
                        demoCursor.style.left = `${targetX - 5}px`;
                        demoCursor.style.top = `${targetY - 5}px`;
                        
                        // スポットライトも追従させる
                        spotlightOverlay.style.setProperty('--x', `${targetX}px`);
                        spotlightOverlay.style.setProperty('--y', `${targetY}px`);
                        
                        // 移動アニメーションを待つ
                        await sleep(600); 
                    }
                } 
                else if (step.type === 'click') {
                    const el = document.getElementById(step.targetId);
                    if (el) {
                        // クリック時の波紋エフェクトを手動発火
                        const rect = el.getBoundingClientRect();
                        const x = rect.left + rect.width / 2;
                        const y = rect.top + rect.height / 2;
                        
                        const ripple = document.createElement('div');
                        ripple.className = 'click-ripple';
                        ripple.style.left = `${x}px`;
                        ripple.style.top = `${y}px`;
                        document.body.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 800);

                        // カーソルを沈み込ませる（クリック感）
                        demoCursor.style.transform = 'scale(0.8)';
                        await sleep(100);
                        
                        // 実際のクリックイベント発火
                        el.click();
                        
                        await sleep(100);
                        demoCursor.style.transform = 'scale(1)';
                    }
                }
            }

            demoCursor.style.display = 'none';
            isDemoRunning = false;
            
            // 録画中なら自動で停止する
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecordBtn.click();
            }
        }

        // デモ録画開始ボタンのイベント
        document.getElementById('demo-record-btn').addEventListener('click', async () => {
            // 現在のリストを初期状態にリセット
            currentItems = [...quizData];
            renderList();
            document.getElementById('result-message').classList.add('hidden');

            try {
                // 画面共有開始
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "never" }, audio: false });
                mediaRecorder = new MediaRecorder(screenStream, { mimeType: 'video/webm' });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'auto-demo-recording.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    recordedChunks = [];
                    resetRecordUI();
                    isDemoRunning = false; // デモ強制終了
                    demoCursor.style.display = 'none';
                };

                mediaRecorder.start();
                
                // UI更新
                startRecordBtn.disabled = true;
                startRecordBtn.classList.add('opacity-50', 'cursor-not-allowed');
                document.getElementById('demo-record-btn').disabled = true;
                document.getElementById('demo-record-btn').classList.add('opacity-50', 'cursor-not-allowed');
                stopRecordBtn.disabled = false;
                stopRecordBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                stopRecordBtn.classList.replace('bg-gray-500', 'bg-gray-800');
                recordingStatus.classList.remove('hidden');

                // 録画開始後、少し待ってからシナリオ開始
                await sleep(1000);
                runDemoScenario();

            } catch (err) {
